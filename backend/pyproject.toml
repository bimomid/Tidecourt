[project]
name = "backend"
version = "0.1.0"
description = "Tidecourt 服务端"
readme = "README.md"
authors = [
  { name = "bimomid", email = "CharileLKH123@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = []

[project.scripts]
backend = "backend:main"

[dependency-groups]
dev = [
  "mypy",
  "ruff",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "PIE", "PERF", "FURB", "RUF",
  "S", "ANN", "D", "RET", "ARG", "PTH", "TRY", "ASYNC", "TID", "ERA", "DTZ", "LOG", "G",
]
ignore = [
  "D203",
  "D213",
  "ANN401",
  "TRY003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "D", "PLR2004"]
"src/backend/__init__.py" = ["D104"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
show_error_codes = true
files = ["src"]
